name: Reporte Diario TaskFlow

on:
  schedule:
    - cron: '30 11 * * 1-5'  # 8:30 AM Chile (UTC-3), lunes a viernes
  workflow_dispatch:          # permite ejecutar manualmente

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install nodemailer

      - name: Enviar reportes por persona
        env:
          SUPABASE_URL: https://wvjzzefvimaegrphixdq.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: autofacilreportes@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: node .github/workflows/scripts/taskflow-reporte.js
