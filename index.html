<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0041A2">
<meta name="description" content="TaskFlow AutoFácil — control de actividades, equipos, alertas y métricas.">
<title>TaskFlow 4.3 · AutoFácil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003783; --navy2:#0041A2; --navy3:#075ccb;
  --cyan:#009AFE; --cyan2:#45b8ff; --cyan-soft:#e8f6ff;
  --bg:#f4f7fb; --bg2:#e9eef6;
  --surface:#ffffff; --surface2:#f3f6fb; --surface3:#eaeff7;
  --border:#e0e7f1; --border2:#cdd7e6;
  --text:#16243d; --text2:#5a6a86; --text3:#94a1b8;
  --green:#15a05a; --green-l:#e2f6ec; --green-t:#0c6b3c;
  --amber:#df9000; --amber-l:#fdf2dc; --amber-t:#946000;
  --red:#e0455b; --red-l:#fdeaed; --red-t:#a52339;
  --blue:#2f7de0; --blue-l:#e6f0fd; --blue-t:#1c4f97;
  --violet:#8a5cf6; --violet-l:#f0eafe; --violet-t:#5a32b0;
  --slate:#64748b; --slate-l:#eef1f6; --slate-t:#475569;
  --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-sm:0 1px 2px rgba(20,40,80,.06);
  --sh:0 4px 14px rgba(20,40,80,.08);
  --sh-lg:0 14px 40px rgba(20,40,80,.16);
  --ff:'Hanken Grotesk',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ff);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 500px at 100% -10%, rgba(20,153,214,.10), transparent 60%),
  radial-gradient(800px 500px at -10% 110%, rgba(0,32,96,.08), transparent 55%);}
button{font-family:inherit}

/* layout */
.app{display:flex;min-height:100vh;height:100vh;overflow:hidden}
.sidebar{width:248px;min-width:248px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--navy3));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,32,96,.3)}
.brand-mark svg{width:21px;height:21px}
.brand-txt .bt-1{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1}
.brand-txt .bt-1 em{font-style:normal;color:var(--cyan)}
.brand-txt .bt-2{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.5px;margin-top:3px}
.sync{font-size:10.5px;color:var(--text3);font-family:var(--fm);padding:8px 18px 2px;display:flex;align-items:center;gap:6px;min-height:18px}
.rt-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(21,160,90,.5);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,160,90,.45)}70%{box-shadow:0 0 0 6px rgba(21,160,90,0)}100%{box-shadow:0 0 0 0 rgba(21,160,90,0)}}

.me-card{margin:12px;padding:11px 12px;background:linear-gradient(135deg,var(--surface2),var(--surface3));border:1px solid var(--border);border-radius:var(--r-lg);display:flex;align-items:center;gap:11px}
.me-info{flex:1;min-width:0}
.me-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-role{font-size:10.5px;color:var(--text3);font-weight:600;margin-top:1px}
.me-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.linkbtn{font-size:10.5px;color:var(--cyan);background:none;border:none;cursor:pointer;font-weight:700;padding:0;white-space:nowrap}
.linkbtn.muted{color:var(--text3);font-weight:600}
.linkbtn:hover{text-decoration:underline}

.nav{padding:8px 10px;flex:1;overflow-y:auto}
.nav-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.7px;text-transform:uppercase;padding:14px 10px 6px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:none;background:none;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:600;text-align:left;margin-bottom:2px;transition:.15s;position:relative}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--cyan-soft);color:var(--navy);font-weight:700}
.nav-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:3px;background:var(--cyan)}
.nav-ic{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-badge{margin-left:auto;background:var(--surface3);color:var(--text2);font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}
.nav-btn.active .nav-badge{background:var(--cyan);color:#fff}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.8);backdrop-filter:blur(10px);position:relative;z-index:5}
.hamb{display:none;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hamb svg{width:18px;height:18px}
.pg-title{font-size:18px;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
.content-inner{max-width:1100px;margin:0 auto}

/* buttons */
.btn{padding:9px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2);border-color:var(--text3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,32,96,.25)}
.btn-primary:hover{filter:brightness(1.08);border-color:transparent}
.btn-cyan{background:var(--cyan);color:#fff;border-color:transparent}
.btn-cyan:hover{filter:brightness(1.05)}
.btn-danger{background:var(--red-l);color:var(--red-t);border-color:#f4c4cd}
.btn-danger:hover{background:#fbdde2}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:8px}

/* avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;letter-spacing:-.3px}
.av-stack{display:flex;align-items:center}
.av-stack .avatar{border:2px solid var(--surface);margin-left:-7px}
.av-stack .avatar:first-child{margin-left:0}
.av-more{border-radius:50%;background:var(--surface3);color:var(--text2);font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-7px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.s-Pendiente{background:var(--amber-l);color:var(--amber-t)}
.s-EnProgreso{background:var(--blue-l);color:var(--blue-t)}
.s-Enrevisión{background:var(--violet-l);color:var(--violet-t)}
.s-Completada{background:var(--green-l);color:var(--green-t)}
.s-Bloqueada{background:var(--red-l);color:var(--red-t)}
.pr-Baja{background:var(--slate-l);color:var(--slate-t)}
.pr-Media{background:var(--amber-l);color:var(--amber-t)}
.pr-Alta{background:var(--red-l);color:var(--red-t)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600;background:var(--surface3);color:var(--text2)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--accent,var(--cyan-soft));opacity:.12}
.stat-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stat-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-1.2px;line-height:1;font-family:var(--fm)}
.stat-lbl{font-size:11.5px;color:var(--text2);font-weight:600;margin-top:5px}

/* greeting */
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2) 55%,var(--navy3));border-radius:var(--r-xl);padding:24px 26px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::before{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(72,184,236,.35),transparent 70%)}
.hero-hi{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.3px}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-.7px;margin-top:3px}
.hero-sub{font-size:13.5px;opacity:.82;margin-top:8px;max-width:520px}

/* section */
.sec{margin-bottom:24px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sec-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.sec-line{flex:1;height:1px;background:var(--border)}

/* task card */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 17px;margin-bottom:11px;cursor:pointer;transition:.16s;box-shadow:var(--sh-sm);border-left:4px solid var(--lc,var(--slate))}
.tcard:hover{box-shadow:var(--sh);transform:translateY(-1px);border-left-color:var(--lc,var(--cyan))}
.tc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.tc-title{font-size:14.5px;font-weight:700;flex:1;line-height:1.35;letter-spacing:-.2px}
.tc-by{font-size:11px;color:var(--text3);font-weight:600;margin-top:3px}
.tc-desc{font-size:12.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:11px}
.tc-foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--text3);font-weight:600}
.tc-meta{display:inline-flex;align-items:center;gap:4px}
.ring{flex-shrink:0}

.progress-mini{height:6px;background:var(--surface3);border-radius:6px;overflow:hidden;flex:1;min-width:60px;max-width:120px}
.progress-mini i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));transition:width .4s}

/* stage steps */
.steps{display:flex;gap:3px;margin:10px 0}
.step{flex:1;height:6px;border-radius:6px;background:var(--surface3);transition:.3s}
.step.done{background:var(--cyan)}
.step.active{background:var(--navy);box-shadow:0 0 0 2px rgba(20,153,214,.2)}
.step.blocked{background:var(--red)}

/* kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:264px;width:264px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol-head{display:flex;align-items:center;gap:8px;padding:13px 14px 10px;font-size:12.5px;font-weight:800}
.kcol-count{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--text2)}
.kcol-body{padding:0 10px 12px;overflow-y:auto;flex:1;min-height:60px;transition:background .15s}
.kcol-body.drag-over{background:var(--cyan-soft);border-radius:0 0 var(--r-lg) var(--r-lg)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:grab;box-shadow:var(--sh-sm);transition:.14s;border-top:3px solid var(--lc,var(--slate))}
.kcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.kcard.dragging{opacity:.4;transform:rotate(1.5deg)}
.kc-title{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:7px}
.kc-foot{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text3);font-weight:600}

/* org chart */
.org-wrap{overflow-x:auto;padding:8px 4px 18px}
.tree{display:flex;justify-content:center;min-width:max-content}
.tree ul{display:flex;justify-content:center;padding-top:24px;position:relative}
.tree li{list-style:none;position:relative;padding:24px 10px 0;text-align:center}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--border2);width:50%;height:24px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--border2)}
.tree li:only-child::after,.tree li:only-child::before{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--border2);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--border2);width:0;height:24px}
.node{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 15px 12px;cursor:pointer;transition:.16s;box-shadow:var(--sh-sm);min-width:130px;position:relative}
.node:hover{border-color:var(--cyan);box-shadow:var(--sh);transform:translateY(-2px)}
.node-name{font-size:12.5px;font-weight:700;line-height:1.2}
.node-area{font-size:10px;color:var(--text3);font-weight:600}
.node-count{position:absolute;top:-8px;right:-8px;background:var(--cyan);color:#fff;font-size:10px;font-weight:800;border-radius:20px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:var(--sh-sm)}
.node.is-admin{background:linear-gradient(135deg,var(--navy),var(--navy3));border-color:transparent}
.node.is-admin .node-name{color:#fff}
.node.is-admin .node-area{color:rgba(255,255,255,.7)}
.node.is-vacant{border-style:dashed;background:var(--surface2)}
.node.is-vacant .node-name{color:var(--text2)}
.node.is-vacant .node-area{color:var(--text3)}

/* team card */
.team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh-sm)}
.team-head{display:flex;align-items:center;gap:13px;padding:16px 18px;background:linear-gradient(120deg,var(--surface2),var(--surface));border-bottom:1px solid var(--border)}
.team-meta{flex:1;min-width:0}
.team-name{font-size:15px;font-weight:800;letter-spacing:-.3px}
.team-sub{font-size:11.5px;color:var(--text3);font-weight:600;margin-top:2px}
.team-kpis{display:flex;gap:18px;flex-wrap:wrap}
.kpi{text-align:center}
.kpi-n{font-size:18px;font-weight:800;font-family:var(--fm);line-height:1}
.kpi-l{font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.team-members{padding:12px 18px 16px;display:flex;flex-wrap:wrap;gap:9px}
.member{display:flex;align-items:center;gap:9px;padding:8px 13px 8px 8px;border:1px solid var(--border);border-radius:30px;cursor:pointer;transition:.15s;background:var(--surface)}
.member:hover{border-color:var(--cyan);background:var(--cyan-soft)}
.member-info{line-height:1.15}
.member-name{font-size:12px;font-weight:700}
.member-stat{font-size:10px;color:var(--text3);font-weight:600}

/* filters */
.filterbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 15px;margin-bottom:18px;box-shadow:var(--sh-sm)}
.frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.frow+.frow{margin-top:9px}
.flabel{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;min-width:54px}
.chip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border2)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fsel{display:flex;flex-direction:column;gap:4px}
.fsel label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fsel select{min-width:150px;padding:8px 32px 8px 12px;font-size:13px;font-weight:600}
.dd{position:relative;display:inline-block}
.dd-menu{display:none;position:absolute;top:115%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:30;min-width:170px;padding:5px;max-height:280px;overflow-y:auto}
.dd-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;border-radius:8px;color:var(--text)}
.dd-item:hover{background:var(--surface2)}

/* view toggle */
.vtoggle{display:inline-flex;background:var(--surface3);border-radius:var(--r);padding:3px;gap:2px}
.vtoggle button{border:none;background:none;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.vtoggle button.active{background:var(--surface);color:var(--navy);box-shadow:var(--sh-sm)}

/* inputs */
input[type=text],input[type=email],input[type=date],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(20,153,214,.13)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6a86' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}

/* modal */
input[type=file]{font-size:12.5px;color:var(--text2);padding:9px;border:1.5px dashed var(--border2);border-radius:var(--r);width:100%;background:var(--surface2);cursor:pointer}
input[type=file]::file-selector-button{font-family:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);margin-right:10px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(15,28,55,.42);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:pop .25s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.m-title{font-size:16px;font-weight:800;flex:1;letter-spacing:-.3px;line-height:1.3}
.m-body{padding:20px 22px;display:flex;flex-direction:column;gap:15px;overflow-y:auto}
.m-foot{padding:15px 22px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface2)}
.xbtn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:19px;line-height:1;flex-shrink:0;transition:.15s}
.xbtn:hover{background:var(--surface3);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field-lbl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--r);padding:4px}
.tab{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;transition:.15s}
.tab.active{background:var(--surface);color:var(--navy);box-shadow:var(--sh-sm)}

/* checkbox list */
.cklist{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto}
.cklist label{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 11px;border-radius:var(--r);border:1.5px solid var(--border);transition:.15s;font-size:13px;font-weight:600}
.cklist label:hover{border-color:var(--border2);background:var(--surface2)}
.cklist input{width:17px;height:17px;accent-color:var(--cyan);cursor:pointer}
.cklist input:checked+.ck-av+span{color:var(--navy)}

/* timeline */
.timeline{border-left:2px solid var(--border);padding-left:16px;margin:4px 0}
.tl-entry{position:relative;margin-bottom:15px}
.tl-dot{position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--cyan);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--border)}
.tl-meta{font-size:10.5px;color:var(--text3);font-family:var(--fm);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-text{font-size:13px;margin-top:3px;line-height:1.45}

.cmt{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:9px}
.cmt-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cmt-author{font-size:12.5px;font-weight:700}
.cmt-date{font-size:10px;color:var(--text3);font-family:var(--fm);margin-left:auto}
.cmt-text{font-size:13px;color:var(--text2);line-height:1.5}

/* tables */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--surface2)}

/* misc */
.empty{text-align:center;padding:54px 20px;color:var(--text3)}
.empty-ic{font-size:42px;margin-bottom:12px;opacity:.6}
.empty-t{font-size:14px;font-weight:600}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pin-wrap{display:flex;gap:11px;justify-content:center;margin:10px 0}
.pin-in{width:54px;height:60px;text-align:center;font-size:24px;font-weight:700;border:2px solid var(--border);border-radius:var(--r-lg);background:var(--surface);color:var(--text);font-family:var(--fm);outline:none;transition:.15s}
.pin-in:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(20,153,214,.15)}
.err{color:var(--red);font-size:12.5px;text-align:center;min-height:18px;font-weight:600}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,28,55,.4);z-index:55}

.donut{position:relative;width:128px;height:128px;margin:0 auto}
.donut svg{transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-n{font-size:26px;font-weight:800;font-family:var(--fm);line-height:1}
.donut-l{font-size:10px;color:var(--text3);font-weight:600}

@media(max-width:860px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .scrim.open{display:block}
  .hamb{display:flex}
  .content{padding:16px}
  .frow2{grid-template-columns:1fr}
  .topbar{padding:13px 16px}
  .pg-title{font-size:16px}
  .team-head{flex-wrap:wrap}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:20px}
  .hero-name{font-size:22px}
}

async function loadAll(){
  setSync('sincronizando…',false);
  const[uR,tR,pR,cR]=await Promise.all([
    db.from('tf_users').select('*').order('created_at'),
    db.from('tf_tasks').select('*').order('created_at',{ascending:false}),
    db.from('tf_progress').select('*').order('created_at'),
    db.from('tf_comments').select('*').order('created_at'),
  ]);
  const firstError=[uR,tR,pR,cR].find(r=>r.error)?.error;
  if(firstError){setSync('Sin conexión',false);toast('No se pudieron sincronizar los datos');return;}
  DATA.users=uR.data||[];DATA.tasks=tR.data||[];
  DATA.progress={};(pR.data||[]).forEach(p=>{(DATA.progress[p.task_id]=DATA.progress[p.task_id]||[]).push(p);});
  DATA.comments={};(cR.data||[]).forEach(c=>{(DATA.comments[c.task_id]=DATA.comments[c.task_id]||[]).push(c);});
  setSync('En vivo · v4.3',true);
  updateBadges();
  if(S.user)renderView();
}
function setSync(txt,live){const el=document.getElementById('sync');if(el)el.innerHTML=`${live?'<span class="rt-dot"></span>':''}${txt}`;}
function subscribeRealtime(){
  db.channel('tf-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'tf_tasks'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'tf_progress'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'tf_comments'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'tf_users'},()=>loadAll())
    .subscribe();
}

function submitLoginIdentity(){
  const input=(document.getElementById('login-user')?.value||'').trim().toLowerCase();const err=document.getElementById('login-error');
  if(!input){if(err)err.textContent='Ingresa tu nombre o correo para continuar.';return;}

  let matches=active.filter(u=>(u.name||'').toLowerCase()===input||(u.email||'').toLowerCase()===input);

    return t.status==='Bloqueada'||(d.diff!==undefined&&d.diff<=3);

function areaSeries(){
  const groups=AREAS.map(a=>({name:a,abbr:areaAbbr(a),col:AREA_COLOR[a],legacy:false}));
  const legacyPpl=DATA.users.filter(u=>u.role!=='vacant'&&u.role!=='inactive'&&!AREAS.includes(u.area));
  groups.push({name:'Otras / antiguas',abbr:'Otr',col:'var(--slate)',legacy:true});
  groups.forEach(g=>{
    const ppl=g.legacy?legacyPpl:DATA.users.filter(u=>u.role!=='vacant'&&u.role!=='inactive'&&u.area===g.name);
    const tasks=tasksOf(ppl.map(p=>p.id));
    g.tasks=tasks;g.total=tasks.length;g.people=ppl.length;
    g.counts={};STAGES.forEach(s=>g.counts[s]=tasks.filter(t=>t.status===s).length);
    g.avg=tasks.length?Math.round(tasks.reduce((a,t)=>a+(t.progress||0),0)/tasks.length):0;
    g.pend=g.counts['Pendiente'];g.done=g.counts['Completada'];g.blocked=g.counts['Bloqueada'];
  });
  return groups;
}
function niceMax(m){if(m<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(m)));const r=m/p;const n=r<=1?1:r<=2?2:r<=5?5:10;return n*p;}
function chartStackedBar(rows){
  const W=720,H=250,padL=32,padR=8,padT=16,padB=44;
  const cw=W-padL-padR,chH=H-padT-padB;
  const nice=niceMax(Math.max(...rows.map(g=>g.total),1));
  const n=rows.length,slot=cw/n,bw=Math.min(48,slot*0.55);
  const order=['Completada','En revisión','En progreso','Pendiente','Bloqueada'];
  let grid='';const ticks=4;
  for(let i=0;i<=ticks;i++){const val=Math.round(nice*i/ticks);const y=padT+chH-(val/nice)*chH;grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text3)">${val}</text>`;}
  let bars='';
  rows.forEach((g,i)=>{
    const cx=padL+slot*i+slot/2;let yb=padT+chH;
    order.forEach(st=>{const cnt=g.counts[st];if(!cnt)return;const hgt=(cnt/nice)*chH;yb-=hgt;bars+=`<rect x="${cx-bw/2}" y="${yb}" width="${bw}" height="${hgt}" fill="${STATUS_COLOR[st]}"><title>${g.name} · ${st}: ${cnt}</title></rect>`;});
    if(g.total)bars+=`<text x="${cx}" y="${yb-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text2)">${g.total}</text>`;
    bars+=`<text x="${cx}" y="${H-padB+15}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${g.legacy?'var(--text3)':'var(--text2)'}">${g.abbr}</text>`;
    if(!g.legacy)bars+=`<rect x="${padL+slot*i+2}" y="${padT}" width="${slot-4}" height="${chH}" fill="transparent" style="cursor:pointer" onclick="goAreaFilter('${g.name}')"><title>Ver tareas de ${g.name}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${bars}</svg>`;
}

const BUCKET='task-files';
let curFiles=[];
async function listFiles(taskId){
  const{data,error}=await db.storage.from(BUCKET).list(taskId,{limit:200,sortBy:{column:'name',order:'asc'}});
  if(error)throw error;
  return (data||[]).filter(f=>f.name&&f.name!=='.emptyFolderPlaceholder');
}
function updateFileCountUI(taskId,count){
  document.querySelectorAll('.doc-count').forEach(el=>{
    if(el.dataset.task!==String(taskId))return;
    el.textContent='📎 '+fileCountText(count);
    el.classList.toggle('has-content',Number.isFinite(count)&&count>0);
    el.classList.toggle('is-unavailable',count===null);
  });
}
async function hydrateFileCounts(tasks){
  const pending=tasks.filter(t=>!hasOwn(DATA.fileCounts,t.id)&&!fileCountLoading.has(t.id));
  pending.forEach(t=>fileCountLoading.add(t.id));
  for(let i=0;i<pending.length;i+=6){
    await Promise.all(pending.slice(i,i+6).map(async t=>{
      try{const files=await listFiles(t.id);DATA.fileCounts[t.id]=files.length;updateFileCountUI(t.id,files.length);}
      catch{DATA.fileCounts[t.id]=null;updateFileCountUI(t.id,null);}
      finally{fileCountLoading.delete(t.id);}
    }));
  }
}
function fileUrl(path){return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;}
function dispName(name){return name.includes('__')?name.split('__').slice(1).join('__'):name;}
function fileIcon(name){const e=(name.split('.').pop()||'').toLowerCase();if(e==='pdf')return '📄';if(['xls','xlsx','csv'].includes(e))return '📊';if(['doc','docx'].includes(e))return '📝';if(['ppt','pptx'].includes(e))return '📽️';return '📎';}
async function uploadFiles(taskId,fileList,opts={}){
  const files=[...fileList];let ok=0;
  const pct=(DATA.tasks.find(x=>x.id===taskId)||{}).progress||0;
  for(const file of files){
    if(file.size>15*1024*1024){toast('«'+file.name+'» supera 15 MB');continue;}
    const safe=file.name.replace(/[^\w.\- ]+/g,'_').replace(/\s+/g,'_');
    const path=`${taskId}/${Date.now()}__${safe}`;
    const{error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
    if(error){toast('Error al subir: '+(error.message||'almacenamiento no disponible'));continue;}
    ok++;
    await db.from('tf_progress').insert({task_id:taskId,user_id:S.user.id,text:`📎 Adjuntó el archivo "${file.name}"`,pct});
  }
  if(ok&&!opts.silent)toast(ok+' archivo(s) adjuntado(s) ✓');
  if(ok)notifyTask(taskId,'file',{message:ok+' archivo(s) adjuntado(s)'});
  return ok;
}
async function loadFilesInto(taskId){
  const box=document.getElementById('files-box');if(!box)return;
  let items=[];

async function deleteFileDetail(taskId,index){

/* ---------- email notifications (via Supabase Edge Function) ---------- */
async function notifyTask(taskId,event,opts={}){
  try{
    const t=DATA.tasks.find(x=>x.id===taskId);
    const ids=[...new Set([...(t?.assignees||[]),...(opts.extra||[])])];
    const recipients=ids.map(id=>getU(id)).filter(u=>u&&u.email&&u.role!=='vacant'&&u.role!=='inactive'&&!/@taskflow\.local$/i.test(u.email)).map(u=>({name:u.name,email:u.email}));
    if(!recipients.length)return{sent:0};
    const{data,error}=await db.functions.invoke('notify-task',{body:{event,taskId,title:t?.title||'',status:t?.status||'',dueDate:t?.dueDate||t?.due_date||'',actor:S.user&&S.user.name,message:opts.message||'',urgent:event==='urgent'||!!opts.urgent,recipients,appUrl:location.origin+location.pathname}});
    return error?{sent:0,error}:{sent:data?.sent||0,failed:data?.failed||0};
  }catch(e){return{sent:0,error:e};}
}

function assignChipsHTML(){

async function createTask(){
  const ti=document.getElementById('nt-ti').value.trim();
  if(!ti){toast('El título es obligatorio');return;}
  const originVal=document.getElementById('nt-origin').value;
  if(!originVal){toast('Selecciona el origen');return;}
  const btn=document.getElementById('btn-create');if(btn){btn.disabled=true;btn.textContent='Creando…';}
  const oo=document.getElementById('nt-origin-other').value.trim();
  const origin=originVal==='Otro'?(oo||'Otro'):originVal;
  const picked=[...assignSel];
  const coMgr=[];picked.forEach(id=>{const u=getU(id);const m=u&&areaManager(u.area);if(m&&!picked.includes(m.id)&&!coMgr.includes(m.id))coMgr.push(m.id);});
  const assignees=[...new Set([...picked,...coMgr])];
  const newId=uid();
  const{error}=await db.from('tf_tasks').insert({id:newId,title:ti,description:document.getElementById('nt-de').value||'',status:'Pendiente',priority:document.getElementById('nt-pr').value,assignees,stage:0,progress:0,due_date:document.getElementById('nt-du').value||'—',created_by:S.user.id,origin});
  if(error){toast('Error: '+error.message);if(btn){btn.disabled=false;btn.textContent='Crear tarea';}return;}
  const nf=document.getElementById('nt-files');
  if(nf&&nf.files&&nf.files.length){if(btn)btn.textContent='Subiendo archivos…';await uploadFiles(newId,nf.files,{silent:true});}
  closeModal();toast('Tarea creada ✓');await loadAll();notifyTask(newId,'assigned',{});
}
function areaManager(area){
  if(!area)return null;
  const inArea=DATA.users.filter(u=>u.role!=='vacant'&&u.role!=='inactive'&&u.area===area);
  if(!inArea.length)return null;
  let m=inArea.find(u=>{const s=getU(u.supervisor_id);return s&&isAdminUser(s);});
  if(m)return m;
  m=inArea.find(u=>{const s=getU(u.supervisor_id);return !s||s.area!==area;});
  return m||inArea[0];
}
function openReassign(taskId){
  const t=DATA.tasks.find(x=>x.id===taskId);if(!t)return;
  if(t.status==='Completada'){toast('No se puede reasignar una tarea completada');return;}
  const cur=getU((t.assignees||[])[0]);
  const curGer=cur?areaManager(cur.area):null;
  const users=DATA.users.filter(u=>u.role!=='vacant'&&u.role!=='inactive');
  const optsByArea=AREAS.map(a=>{const us=users.filter(u=>u.area===a);return us.length?`<optgroup label="${a}">${us.map(u=>`<option value="${u.id}" ${cur&&cur.id===u.id?'selected':''}>${esc(u.name)}${cargoOf(u)?' — '+esc(cargoOf(u)):''}</option>`).join('')}</optgroup>`:'';}).join('');
  const others=users.filter(u=>!AREAS.includes(u.area));
  const optsOther=others.length?`<optgroup label="Otras / antiguas">${others.map(u=>`<option value="${u.id}" ${cur&&cur.id===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</optgroup>`:'';
  openModal(`
    <div class="m-head"><div class="m-title">Reasignar — ${esc(t.title)}</div><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="m-body">
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;font-size:12.5px">
        <div style="font-weight:700;color:var(--text2);margin-bottom:4px">Responsabilidad actual</div>
        <div style="color:var(--text2)">👤 ${cur?esc(cur.name):'Sin responsable'}${cur&&cur.area?` · ${esc(cur.area)}`:''}${curGer&&(!cur||curGer.id!==cur.id)?` &nbsp;|&nbsp; 🏛️ Gerente: ${esc(curGer.name)}`:''}</div>
      </div>
      <div class="field"><div class="field-lbl">Nuevo responsable *</div><select id="ra-user" onchange="raPreview()"><option value="">— Selecciona —</option>${optsByArea}${optsOther}</select></div>
      <div id="ra-info" style="font-size:11.5px;color:var(--cyan);font-weight:600;display:none"></div>
      <div class="field"><div class="field-lbl">Motivo del cambio *</div><textarea id="ra-motivo" placeholder="Explica por qué se reasigna la tarea…"></textarea></div>
      <div style="font-size:11px;color:var(--text3);font-weight:600;line-height:1.5">Se mantiene la corresponsabilidad: el nuevo responsable queda corresponsable con el Gerente de su área. Si cambia de área, también se conserva la corresponsabilidad anterior. Todo queda registrado en el historial.</div>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-cyan btn-sm" id="btn-ra" onclick="doReassign('${taskId}')">Reasignar</button></div>`);
}
function raPreview(){
  const info=document.getElementById('ra-info');if(!info)return;
  const u=getU(document.getElementById('ra-user').value);if(!u){info.style.display='none';return;}
  const m=areaManager(u.area);
  info.style.display='';
  info.innerHTML=`Corresponsable que se agrega: 🏛️ ${m?esc(m.name)+' (Gerente '+esc(u.area||'')+')':'(sin gerente de área definido)'}.`;
}
async function doReassign(taskId){
  const t=DATA.tasks.find(x=>x.id===taskId);if(!t)return;
  const newId=document.getElementById('ra-user').value;
  const motivo=document.getElementById('ra-motivo').value.trim();
  if(!newId){toast('Selecciona el nuevo responsable');return;}
  if(!motivo){toast('Indica el motivo del cambio');return;}
  const newU=getU(newId);const oldResp=getU((t.assignees||[])[0]);
  if(oldResp&&oldResp.id===newId){toast('Esa persona ya es la responsable');return;}
  const newGer=areaManager(newU.area);
  const oldGer=oldResp?areaManager(oldResp.area):null;
  const cross=oldResp&&oldResp.area&&newU.area&&oldResp.area!==newU.area;
  const acc=[newId];
  if(newGer&&newGer.id!==newId)acc.push(newGer.id);
  if(oldResp&&!acc.includes(oldResp.id))acc.push(oldResp.id);
  if(oldGer&&!acc.includes(oldGer.id))acc.push(oldGer.id);
  (t.assignees||[]).forEach(idd=>{if(!acc.includes(idd))acc.push(idd);});
  const assignees=[...new Set(acc)];
  let hist=`🔄 Reasignada ${oldResp?'de '+oldResp.name+' ':''}a ${newU.name} (${newU.area||'sin área'}).`;
  if(newGer&&newGer.id!==newId)hist+=` Corresponsable: ${newGer.name} (Gerente ${newU.area}).`;
  if(cross)hist+=` Cambio de área (${oldResp.area} → ${newU.area}): se mantiene la corresponsabilidad anterior.`;
  hist+=` Motivo: ${motivo}`;
  const btn=document.getElementById('btn-ra');if(btn){btn.disabled=true;btn.textContent='Reasignando…';}
  await db.from('tf_progress').insert({task_id:taskId,user_id:S.user.id,text:hist,pct:t.progress||0});
  await db.from('tf_comments').insert({task_id:taskId,user_id:S.user.id,text:`Reasignación de responsable — Motivo: ${motivo}`});
  const{error}=await db.from('tf_tasks').update({assignees}).eq('id',taskId);
  if(error){toast('Error: '+error.message);if(btn){btn.disabled=false;btn.textContent='Reasignar';}return;}
  closeModal();toast('Tarea reasignada ✓');await loadAll();notifyTask(taskId,'reassigned',{message:motivo});
}

async function saveTask(id){
  const btn=document.getElementById('btn-save');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  const stat=document.getElementById('et-st').value;
  const ov=document.getElementById('et-origin').value;const oo=document.getElementById('et-origin-other').value.trim();
  const origin=ov==='Otro'?(oo||'Otro'):ov;
  const{error}=await db.from('tf_tasks').update({title:document.getElementById('et-ti').value,description:document.getElementById('et-de').value,priority:document.getElementById('et-pr').value,status:stat,stage:STAGES.indexOf(stat),due_date:document.getElementById('et-du').value||'—',origin}).eq('id',id);

async function deleteTask(id){
  if(!confirm('¿Eliminar esta tarea? Esta acción no se puede deshacer.'))return;
  await db.from('tf_tasks').delete().eq('id',id);
  closeModal();toast('Tarea eliminada');await loadAll();
}

function exportTasksCSV(){
  const scope=isAdminUser(S.user)?DATA.tasks:visibleTasks();
  const head=['Título','Estado','Prioridad','Origen','Fecha límite','Avance','Responsable','Corresponsables','Área','Creada por'];

  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[head,...rows].map(r=>r.map(cell).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`taskflow-reporte-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);toast('Reporte exportado ✓');
}

function cargoDatalist(){const set=[...new Set(DATA.users.map(cargoOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b));return `<datalist id="cargo-list">${set.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;}
function areaOptions(cur){
  let html=`<option value="">— Selecciona —</option>`+AREAS.map(a=>`<option value="${esc(a)}" ${cur===a?'selected':''}>${esc(a)}</option>`).join('');
  if(cur&&!AREAS.includes(cur))html+=`<option value="${esc(cur)}" selected>${esc(cur)} (antigua)</option>`;
  return html;
}
function toggleVacant(p){
  const on=document.getElementById(p+'-vac').checked;
  const set=(id,show)=>{const e=document.getElementById(id);if(e)e.style.display=show?'':'none';};
  set(p+'-na-field',!on);set(p+'-em-field',!on);set(p+'-pin-field',!on);
  const hint=document.getElementById(p+'-assign-hint');if(hint)hint.style.display=on?'none':'';
}
function openEditUser(userId){
  const u=getU(userId);const everyone=DATA.users.filter(x=>x.id!==userId);
  const vac=u.role==='vacant';
  const curCargo=cargoOf(u)||(vac?u.name:'');
  openModal(`
    <div class="m-head">${avatar(u,38)}<div class="m-title">Editar — ${esc(u.name)}</div><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="m-body">
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px"><input type="checkbox" id="eu-vac" style="width:17px;height:17px;accent-color:var(--cyan)" ${vac?'checked':''} onchange="toggleVacant('eu')"> Cargo vacante (posición sin titular)</label>
      <div id="eu-assign-hint" style="font-size:11.5px;color:var(--cyan);font-weight:600;margin-top:-7px;${vac?'':'display:none'}">💡 Desmarca la casilla y completa los datos para asignar esta posición a una persona.</div>
      <div class="field"><div class="field-lbl">Posición / Cargo *</div><input type="text" id="eu-cargo" list="cargo-list" value="${esc(curCargo)}" placeholder="Ej: Jefe Comercial, Analista de Riesgo…">${cargoDatalist()}</div>
      <div class="field" id="eu-na-field" style="${vac?'display:none':''}"><div class="field-lbl">Nombre de la persona *</div><input type="text" id="eu-na" value="${vac?'':esc(u.name)}" placeholder="Nombre Apellido"></div>
      <div class="field" id="eu-em-field" style="${vac?'display:none':''}"><div class="field-lbl">Email *</div><input type="text" id="eu-em" value="${esc(u.email||'')}"></div>
      <div class="frow2">
        <div class="field"><div class="field-lbl">Área *</div><select id="eu-area">${areaOptions(u.area)}</select></div>
        <div class="field"><div class="field-lbl">Reporta a (supervisor)</div><select id="eu-sup"><option value="">— Sin supervisor —</option>${everyone.map(x=>`<option value="${x.id}" ${u.supervisor_id===x.id?'selected':''}>${esc(x.name)}${x.role==='admin'?' (Gerencia General)':(x.role==='vacant'?' (vacante)':'')}</option>`).join('')}</select></div>
      </div>
      <div class="field" id="eu-pin-field" style="${vac?'display:none':''}"><div class="field-lbl">${vac?'PIN de acceso (4 dígitos)':'Nuevo PIN (vacío = sin cambio)'}</div><input type="text" inputmode="numeric" id="eu-pi" placeholder="••••" maxlength="4" style="font-family:var(--fm);letter-spacing:7px;font-size:19px;text-align:center"></div>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="btn-eu" onclick="saveEditUser('${userId}')">Guardar</button></div>`);
}
async function saveEditUser(userId){
  const wasVacant=(getU(userId)||{}).role==='vacant';
  const vac=document.getElementById('eu-vac').checked;
  const cargo=document.getElementById('eu-cargo').value.trim();
  const na=document.getElementById('eu-na').value.trim();const email=document.getElementById('eu-em').value.trim();
  const supId=document.getElementById('eu-sup').value||null;const pin=document.getElementById('eu-pi').value.trim();const area=document.getElementById('eu-area').value;
  if(vac&&!cargo){toast('Indica el nombre del cargo');return;}
  if(!vac&&!na){toast('Indica el nombre de la persona');return;}
  if(!area){toast('Selecciona un área');return;}
  if(!vac&&!email){toast('Completa el email');return;}
  if(!vac&&pin&&!/^\d{4}$/.test(pin)){toast('El PIN debe ser 4 dígitos');return;}
  const name=vac?cargo:na;
  const btn=document.getElementById('btn-eu');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  const parts=name.split(' ');const initials=(parts[0][0]+(parts[1]?parts[1][0]:parts[0][1]||'')).toUpperCase();
  const updates={name,initials,supervisor_id:supId,area,color:cargo||'av-user',role:vac?'vacant':'user'};
  if(vac){updates.email='vacante-'+userId+'@taskflow.local';updates.pin='0000';}
  else{updates.email=email||'';if(pin)updates.pin=pin;else if(wasVacant)updates.pin='1234';}
  const{error}=await db.from('tf_users').update(updates).eq('id',userId);
  if(error){toast('Error: '+error.message);if(btn){btn.disabled=false;btn.textContent='Guardar';}return;}
  if(S.user&&S.user.id===userId){S.user={...S.user,...updates};updateMe();}
  closeModal();toast(wasVacant&&!vac?'Posición asignada ✓':'Usuario actualizado ✓');await loadAll();
}
function openNewUser(){
  const everyone=DATA.users;
  openModal(`
    <div class="m-head"><div class="m-title">Nuevo usuario o posición</div><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="m-body">
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px"><input type="checkbox" id="nu-vac" style="width:17px;height:17px;accent-color:var(--cyan)" onchange="toggleVacant('nu')"> Cargo vacante (posición sin titular, sin acceso ni PIN)</label>
      <div class="field"><div class="field-lbl">Posición / Cargo *</div><input type="text" id="nu-cargo" list="cargo-list" placeholder="Ej: Jefe Comercial, Analista de Riesgo…">${cargoDatalist()}</div>
      <div class="field" id="nu-na-field"><div class="field-lbl">Nombre de la persona *</div><input type="text" id="nu-na" placeholder="Nombre Apellido"></div>
      <div class="field" id="nu-em-field"><div class="field-lbl">Email *</div><input type="text" id="nu-em" placeholder="usuario@autofacil.cl"></div>
      <div class="frow2">
        <div class="field"><div class="field-lbl">Área *</div><select id="nu-area">${areaOptions('')}</select></div>
        <div class="field"><div class="field-lbl">Reporta a (supervisor)</div><select id="nu-sup"><option value="">— Sin supervisor —</option>${everyone.map(u=>`<option value="${u.id}">${esc(u.name)}${u.role==='admin'?' (Gerencia General)':(u.role==='vacant'?' (vacante)':'')}</option>`).join('')}</select></div>
      </div>
      <div class="field" id="nu-pin-field"><div class="field-lbl">PIN de acceso (4 dígitos)</div><input type="text" inputmode="numeric" id="nu-pi" placeholder="1234" maxlength="4" style="font-family:var(--fm);letter-spacing:7px;font-size:20px;text-align:center"></div>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="btn-nu" onclick="createUser()">Crear</button></div>`);
}
let pendingNewUser=null;
async function createUser(){
  const vac=document.getElementById('nu-vac').checked;
  const cargo=document.getElementById('nu-cargo').value.trim();
  const na=document.getElementById('nu-na').value.trim();const email=document.getElementById('nu-em').value.trim();
  const pin=document.getElementById('nu-pi').value.trim()||'1234';const area=document.getElementById('nu-area').value;
  if(vac&&!cargo){toast('Indica el nombre del cargo');return;}
  if(!vac&&!na){toast('Indica el nombre de la persona');return;}
  if(!area){toast('Selecciona un área');return;}
  if(!vac&&!email){toast('Completa el email');return;}
  if(!vac&&!/^\d{4}$/.test(pin)){toast('El PIN debe ser 4 dígitos');return;}
  const name=vac?cargo:na;
  const parts=name.split(' ');const initials=(parts[0][0]+(parts[1]?parts[1][0]:parts[0][1]||'')).toUpperCase();
  const supId=document.getElementById('nu-sup').value||null;
  if(!vac&&cargo){
    const matches=DATA.users.filter(x=>x.role==='vacant'&&cargoOf(x)===cargo&&x.area===area);
    if(matches.length){pendingNewUser={na,email,pin,area,supId,cargo,initials};openVacancyChooser(matches);return;}
  }
  const btn=document.getElementById('btn-nu');if(btn){btn.disabled=true;btn.textContent='Creando…';}
  const newId=uid();
  const{error}=await db.from('tf_users').insert({id:newId,name,email:vac?('vacante-'+newId+'@taskflow.local'):email,role:vac?'vacant':'user',initials,color:cargo||'av-user',pin:vac?'0000':pin,supervisor_id:supId,area});
  if(error){toast('Error: '+error.message);if(btn){btn.disabled=false;btn.textContent='Crear';}return;}
  closeModal();toast(vac?'Cargo vacante creado ✓':'Usuario creado ✓');await loadAll();
}
function openVacancyChooser(matches){
  const d=pendingNewUser;if(!d)return;
  openModal(`
    <div class="m-head"><div class="m-title">Vacantes de «${esc(d.cargo)}»</div><button class="xbtn" onclick="cancelChooser()">×</button></div>
    <div class="m-body" style="gap:11px">
      <div style="font-size:13px;color:var(--text2);line-height:1.5">Hay <b>${matches.length}</b> posición(es) vacante(s) con este cargo en <b>${esc(d.area)}</b>. Puedes asignar a <b>${esc(d.na)}</b> a una existente o crear una posición nueva (headcount adicional).</div>
      ${matches.map(m=>{const sup=m.supervisor_id?getU(m.supervisor_id):null;return `<button class="btn" style="justify-content:flex-start;text-align:left;height:auto;padding:12px 14px" onclick="fillVacancyWith('${m.id}')">
        <div><div style="font-weight:700">🪑 Ocupar esta vacante</div><div style="font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px">${esc(m.area||'')}${sup?` · reporta a ${esc(sup.name)}`:' · sin supervisor'}</div></div>
      </button>`;}).join('')}
      <button class="btn btn-primary" style="justify-content:flex-start;text-align:left;height:auto;padding:12px 14px" onclick="createUserConfirmNew()">
        <div><div style="font-weight:700">＋ Crear posición nueva</div><div style="font-size:11.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:2px">Agrega otro «${esc(d.cargo)}» como cupo adicional</div></div>
      </button>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="cancelChooser()">Cancelar</button></div>`);
}
function cancelChooser(){pendingNewUser=null;closeModal();}
async function fillVacancyWith(vacId){
  const d=pendingNewUser;if(!d)return;const vac=getU(vacId);if(!vac)return;
  const{error}=await db.from('tf_users').update({name:d.na,email:d.email,role:'user',initials:d.initials,color:d.cargo,pin:d.pin,supervisor_id:d.supId||vac.supervisor_id,area:d.area}).eq('id',vacId);
  if(error){toast('Error: '+error.message);return;}
  pendingNewUser=null;closeModal();toast('Posición vacante ocupada ✓');await loadAll();
}
async function createUserConfirmNew(){
  const d=pendingNewUser;if(!d)return;
  const{error}=await db.from('tf_users').insert({id:uid(),name:d.na,email:d.email,role:'user',initials:d.initials,color:d.cargo||'av-user',pin:d.pin,supervisor_id:d.supId,area:d.area});
  if(error){toast('Error: '+error.message);return;}
  pendingNewUser=null;closeModal();toast('Usuario creado ✓');await loadAll();
}
async function deleteUser(id){
  const u=getU(id);if(!u)return;
  if(u.role==='vacant'){
    if(!confirm(`¿Eliminar la posición vacante "${u.name}"? (esto sí elimina la posición del organigrama)`))return;
    const reps=DATA.users.filter(x=>x.supervisor_id===id);
    for(const r of reps)await db.from('tf_users').update({supervisor_id:u.supervisor_id||null}).eq('id',r.id);
    await db.from('tf_users').delete().eq('id',id);
    toast('Posición eliminada');await loadAll();return;
  }
  const deps=DATA.users.filter(x=>x.supervisor_id===id&&x.role!=='inactive');
  openModal(`
    <div class="m-head"><div class="m-title">Dar de baja — ${esc(u.name)}</div><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="m-body" style="gap:13px">
      <div style="font-size:13.5px;color:var(--text2);line-height:1.55">En ambos casos <b>se conserva su nombre y su historial</b> (avances, comentarios y tareas pasadas) en el registro como <b>Desactivado</b>. Elige qué pasa con su posición${cargoOf(u)?` («${esc(cargoOf(u))}»)`:''}${deps.length?` · tiene <b>${deps.length}</b> persona(s) a cargo`:''}:</div>
      <button class="btn" style="justify-content:flex-start;text-align:left;height:auto;padding:13px 15px" onclick="deactivateUser('${id}','vacant')">
        <div><div style="font-weight:700">🪑 Dejar vacante</div><div style="font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px">La posición queda abierta como VACANTE en el organigrama${deps.length?' y su equipo pasa a depender de la vacante':''}. Para cuando buscarás un reemplazo.</div></div>
      </button>
      <button class="btn" style="justify-content:flex-start;text-align:left;height:auto;padding:13px 15px" onclick="deactivateUser('${id}','remove')">
        <div><div style="font-weight:700">🗑️ Eliminar la posición</div><div style="font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px">La posición desaparece del organigrama${deps.length?' y su equipo pasa a depender de su supervisor':''}. Para cuando el cargo ya no existirá.</div></div>
      </button>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button></div>`);
}
async function deactivateUser(id,mode){
  const u=getU(id);if(!u)return;
  const deps=DATA.users.filter(x=>x.supervisor_id===id&&x.role!=='inactive');
  if(mode==='vacant'){
    const vacId=uid();const title=cargoOf(u)||u.name;const parts=title.split(' ');
    const initials=(parts[0][0]+(parts[1]?parts[1][0]:parts[0][1]||'')).toUpperCase();
    await db.from('tf_users').insert({id:vacId,name:title,email:'vacante-'+vacId+'@taskflow.local',role:'vacant',initials,color:cargoOf(u)||'av-user',pin:'0000',supervisor_id:u.supervisor_id,area:u.area});
    for(const r of deps)await db.from('tf_users').update({supervisor_id:vacId}).eq('id',r.id);
  }else{
    for(const r of deps)await db.from('tf_users').update({supervisor_id:u.supervisor_id||null}).eq('id',r.id);
  }
  await db.from('tf_users').update({role:'inactive'}).eq('id',id);
  closeModal();toast(mode==='vacant'?'Desactivado · posición vacante ✓':'Desactivado · posición eliminada ✓');await loadAll();
}
async function reactivateUser(id){
  const u=getU(id);if(!u||!confirm(`¿Reactivar a ${u.name}? Volverá a aparecer como usuario activo.`))return;
  await db.from('tf_users').update({role:'user'}).eq('id',id);
  toast('Usuario reactivado ✓');await loadAll();
}

/* ---------- PIN change ---------- */
function editMyPin(){if(!S.user){toast('Selecciona un perfil primero');return;}editPin(S.user.id);}
function editPin(userId,adminOverride){
  const u=getU(userId);
  openModal(`
    <div class="m-head"><div class="m-title">Cambiar PIN — ${esc(u.name)}</div><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="m-body" style="align-items:center;text-align:center">
      ${adminOverride?'':`<div style="font-size:12.5px;color:var(--text2);font-weight:600">PIN actual</div>
      <div class="pin-wrap">${[0,1,2,3].map(i=>`<input class="pin-in" type="password" inputmode="numeric" maxlength="1" id="op${i}" oninput="if(this.value)document.getElementById('op${i+1}')?.focus()" onkeydown="if(event.key==='Backspace'&&!this.value)document.getElementById('op${i-1}')?.focus()">`).join('')}</div>`}
      <div style="font-size:12.5px;color:var(--text2);font-weight:600;margin-top:6px">Nuevo PIN</div>
      <div class="pin-wrap">${[0,1,2,3].map(i=>`<input class="pin-in" type="password" inputmode="numeric" maxlength="1" id="np${i}" oninput="if(this.value)document.getElementById('np${i+1}')?.focus()" onkeydown="if(event.key==='Backspace'&&!this.value)document.getElementById('np${i-1}')?.focus()">`).join('')}</div>
      <div class="err" id="pin-chg-err"></div>
    </div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" onclick="savePin('${userId}',${adminOverride?'true':'false'})">Guardar PIN</button></div>`);
  setTimeout(()=>document.getElementById(adminOverride?'np0':'op0')?.focus(),120);
}
async function savePin(userId,adminOverride){
  const u=getU(userId);const newPin=[0,1,2,3].map(i=>document.getElementById('np'+i)?.value||'').join('');const errEl=document.getElementById('pin-chg-err');
  if(!adminOverride){const oldPin=[0,1,2,3].map(i=>document.getElementById('op'+i)?.value||'').join('');if(oldPin!==(u.pin||'1234')){if(errEl)errEl.textContent='PIN actual incorrecto';return;}}
  if(!/^\d{4}$/.test(newPin)){if(errEl)errEl.textContent='El nuevo PIN debe ser 4 dígitos';return;}
  const{error}=await db.from('tf_users').update({pin:newPin}).eq('id',userId);
  if(error){toast('Error al guardar: '+error.message);return;}
  if(S.user&&S.user.id===userId)S.user.pin=newPin;
  closeModal();toast('PIN actualizado ✓');await loadAll();
}

/* ---------- shared UI ---------- */
function toggleOther(id,val){const el=document.getElementById(id);if(!el)return;el.style.display=val==='Otro'?'block':'none';if(val!=='Otro')el.value='';}
function toggleDD(id){closeDDs(id);const el=document.getElementById(id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function closeDDs(except){document.querySelectorAll('.dd-menu').forEach(el=>{if(el.id!==except)el.style.display='none';});}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeDDs();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.getElementById('overlay');if(o&&o.style.display!=='none')closeModal();else closeDrawer();}});

function openModal(html,closeable=true){const o=document.getElementById('overlay');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;o.style.display='flex';o.onclick=closeable?e=>{if(e.target===o)closeModal();}:null;setTimeout(()=>o.querySelector('input,textarea,select,button')?.focus(),40);}
function closeModal(){const o=document.getElementById('overlay');o.style.display='none';o.innerHTML='';}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

init();
</script>
</body>
</html>
